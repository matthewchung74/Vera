# LiveKit Server Configuration
# For Vera - Voice AI for Elderly Users

port: 7880
rtc:
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true
  # OVHcloud VPS public IP
  node_ip: 144.217.241.152

# Logging
logging:
  level: info

# Room settings optimized for voice
room:
  # Auto-create rooms when agents/clients join
  auto_create: true
  # Max participants per room (user + agent only)
  max_participants: 2
  # Empty room timeout (shorter for faster cleanup)
  empty_timeout: 300
  # How long to wait for participant to reconnect after disconnect
  # Extended to 5 minutes to allow reconnection with session memory
  departure_timeout: 300

# Agent dispatch - auto-dispatch agent when room is created
agent:
  # Enable agent auto-dispatch for all rooms
  enabled: true

# Keys are set via environment variable LIVEKIT_KEYS
